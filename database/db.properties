# =========================================================================
# APEX BANK DATABASE CONFIGURATION
# =========================================================================
# By default, db.enabled=false uses the zero-configuration Embedded Database
# (saves automatically to data/bank_database.ser + data/accounts.csv + data/transactions.csv).
#
# To connect to a live MySQL / SQLite / PostgreSQL server via JDBC:
# 1. Place the JDBC driver .jar in your classpath
# 2. Run database/schema.sql on your SQL server
# 3. Set db.enabled=true and configure your credentials below:

db.enabled=false
db.url=jdbc:mysql://localhost:3306/apex_bank_db
db.user=root
db.password=password
